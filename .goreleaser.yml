project_name: smudgetools
release:
  github:
    owner: dbarbuzzi
    name: smudgetools
archive:
  replacements:
    darwin: macOS
    linux: Linux
    windows: Windows
    386: 32bit
    amd64: 64bit
  format_overrides:
    - goos: windows
      format: zip
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
build:
  binary: smudge
  ldflags: "-s -w -X main.version={{ .Version }}"
  goos:
    - darwin
    - linux
    - windows
  goarch:
    - amd64
    - 386
  env:
    - CGO_ENABLED=0
brew:
  name: smudgetools
  github:
    owner: dbarbuzzi
    name: homebrew-tap
  download_strategy: GitHubPrivateRepositoryReleaseDownloadStrategy
  commit_author:
    name: dbarbuzzi
    email: dbarbuzzi@gmail.com
  folder: Formula
  homepage: "https://github.com/dbarbuzzi/smudgetools"
  description: "Tools for my work with smudge comics"
  test: |
    system "#{bin}/smudge --version"
  install: |
    bin.install "smudge"
scoop:
  bucket:
    owner: dbarbuzzi
    name: scoop-bucket
  commit_author:
    name: dbarbuzzi
    email: dbarbuzzi@gmail.com
  homepage: "https://github.com/dbarbuzzi/smudgetools"
  description: "Tools for my work with smudge comics"
