project_name: smudgetools
release:
  github:
    owner: dbarbuzzi
    name: smudgetools
  draft: true
archive:
  replacements:
    darwin: macOS
    linux: Linux
    windows: Windows
    386: 32bit
    amd64: 64bit
  format_overrides:
    - goos: windows
      format: zip
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
build:
  binary: smudge
  ldflags: -s -w
  goos:
    - darwin
    - linux
    - windows
  goarch:
    - amd64
    - 386
  env:
    - CGO_ENABLED=0
