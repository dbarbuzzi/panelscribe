version: 2
project_name: panelscribe
release:
  github:
    owner: dbarbuzzi
    name: panelscribe
archives:
  -
    format_overrides:
      - goos: darwin
        formats: ["zip"]
      - goos: windows
        formats: ["zip"]
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
builds:
  -
    binary: panelscribe
    ldflags: "-s -w -X main.version={{ .Version }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
brews:
  -
    name: panelscribe
    repository:
      owner: dbarbuzzi
      name: homebrew-tap
      token: "{{ .Env.PUBLISH_TOKEN }}"
    download_strategy: GitHubPrivateRepositoryReleaseDownloadStrategy
    custom_require: "../custom_download_strategy"
    commit_author:
      name: dbarbuzzi
      email: dbarbuzzi@gmail.com
    directory: Formula
    homepage: "https://github.com/dbarbuzzi/panelscribe"
    description: "Tools for my work with comics"
    test: |
      system "#{bin}/panelscribe --version"
    install: |
      bin.install "panelscribe"
scoops:
  -
    repository:
      owner: dbarbuzzi
      name: scoop-bucket
      token: "{{ .Env.PUBLISH_TOKEN }}"
    commit_author:
      name: dbarbuzzi
      email: dbarbuzzi@gmail.com
    homepage: "https://github.com/dbarbuzzi/panelscribe"
    description: "Tools for my work with comics"
